<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="yu · chobijaeyu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#a5d6ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="980" cy="70" r="160" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="180" cy="320" r="120" fill="#238636" fill-opacity="0.12" filter="url(#soft)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="6" height="360" fill="url(#accent)"/>

  <!-- monogram -->
  <g transform="translate(72, 88)">
    <rect width="72" height="72" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="36" y="47" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" fill="url(#accent)">yu</text>
  </g>

  <text x="168" y="128" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">hi, I'm yu</text>
  <text x="168" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#8b949e">@chobijaeyu</text>

  <text x="72" y="230" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c9d1d9">Gopher · Angular · full-stack</text>
  <text x="72" y="268" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">SPA からサーバーサイドまで設計・実装します</text>

  <!-- chips -->
  <g transform="translate(72, 300)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <rect width="86" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="43" y="18" text-anchor="middle" fill="#79c0ff">Go</text>

    <rect x="98" width="110" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="153" y="18" text-anchor="middle" fill="#a5d6ff">Angular</text>

    <rect x="220" width="120" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="280" y="18" text-anchor="middle" fill="#7ee787">TypeScript</text>

    <rect x="352" width="72" height="28" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="388" y="18" text-anchor="middle" fill="#d2a8ff">INFP</text>
  </g>
</svg>

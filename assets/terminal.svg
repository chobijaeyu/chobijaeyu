<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="terminal · yu@chobijaeyu">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f3a"/>
      <stop offset="100%" stop-color="#1c212b"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <rect x="1" y="36" width="978" height="483" rx="0"/>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="979" height="519" rx="12" fill="#0b0f14" stroke="#30363d"/>
  <!-- title bar -->
  <path d="M12 1h956a11 11 0 0 1 11 11v24H1V12A11 11 0 0 1 12 1z" fill="url(#chrome)"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="490" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8b949e">yu@chobijaeyu: ~</text>

  <!-- body -->
  <g clip-path="url(#bodyClip)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <!-- prompt line -->
    <text x="24" y="68" font-size="14">
      <tspan fill="#3fb950">yu@chobijaeyu</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#58a6ff">~</tspan>
      <tspan fill="#c9d1d9">$ </tspan>
      <tspan fill="#e6edf3">neofetch</tspan>
    </text>

    <!-- left: ascii gopher-ish block -->
    <g transform="translate(36, 96)" fill="#3fb950" font-size="13" xml:space="preserve">
      <text x="0" y="0">    .--.  </text>
      <text x="0" y="16">   |o_o | </text>
      <text x="0" y="32">   |:_/ | </text>
      <text x="0" y="48">  //   \ \</text>
      <text x="0" y="64"> (|     | )</text>
      <text x="0" y="80">/'\_   _/`\</text>
      <text x="0" y="96">\___)=(___/</text>
      <text x="0" y="128" fill="#8b949e">  gopher</text>
    </g>

    <!-- right: neofetch info -->
    <g transform="translate(220, 96)" font-size="14">
      <text x="0" y="0">
        <tspan fill="#58a6ff" font-weight="700">yu</tspan>
        <tspan fill="#8b949e">@</tspan>
        <tspan fill="#58a6ff" font-weight="700">chobijaeyu</tspan>
      </text>
      <text x="0" y="18" fill="#30363d">-----------------------</text>

      <text x="0" y="44"><tspan fill="#79c0ff">OS</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">Full-stack · SPA → server</tspan></text>
      <text x="0" y="66"><tspan fill="#79c0ff">Host</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">γ Mic</tspan></text>
      <text x="0" y="88"><tspan fill="#79c0ff">Kernel</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">Go · Angular · TypeScript</tspan></text>
      <text x="0" y="110"><tspan fill="#79c0ff">Shell</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">zsh + vim-ish muscle memory</tspan></text>
      <text x="0" y="132"><tspan fill="#79c0ff">Uptime</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">shipping features since 2017</tspan></text>
      <text x="0" y="154"><tspan fill="#79c0ff">Packages</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">Docker, GH Actions, Cloudflare</tspan></text>
      <text x="0" y="176"><tspan fill="#79c0ff">Terminal</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">clear boundaries, simple systems</tspan></text>
      <text x="0" y="198"><tspan fill="#79c0ff">CPU</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">INFP · deep work preferred</tspan></text>
      <text x="0" y="220"><tspan fill="#79c0ff">Memory</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">AI apps · voice · devtools</tspan></text>
      <text x="0" y="242"><tspan fill="#79c0ff">Locale</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#e6edf3">zh / ja / en</tspan></text>

      <!-- color blocks like neofetch -->
      <g transform="translate(0, 268)">
        <rect width="28" height="16" fill="#0d1117" stroke="#30363d"/>
        <rect x="32" width="28" height="16" fill="#ff7b72"/>
        <rect x="64" width="28" height="16" fill="#3fb950"/>
        <rect x="96" width="28" height="16" fill="#d29922"/>
        <rect x="128" width="28" height="16" fill="#58a6ff"/>
        <rect x="160" width="28" height="16" fill="#bc8cff"/>
        <rect x="192" width="28" height="16" fill="#39c5cf"/>
        <rect x="224" width="28" height="16" fill="#e6edf3"/>
      </g>
    </g>

    <!-- second command -->
    <text x="24" y="420" font-size="14">
      <tspan fill="#3fb950">yu@chobijaeyu</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#58a6ff">~</tspan>
      <tspan fill="#c9d1d9">$ </tspan>
      <tspan fill="#e6edf3">echo $STATUS</tspan>
    </text>
    <text x="24" y="444" font-size="14" fill="#7ee787">building SayIt · voice input + AI polish · open source</text>

    <text x="24" y="480" font-size="14">
      <tspan fill="#3fb950">yu@chobijaeyu</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#58a6ff">~</tspan>
      <tspan fill="#c9d1d9">$ </tspan>
      <tspan fill="#e6edf3">_</tspan>
    </text>
  </g>
</svg>
